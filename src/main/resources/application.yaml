spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/collab_db
    username: collab_user
    password: collab_pass

  security:
    user:
     name: admin
     password: admin
    jwt:
     secret: super-secret-key-change-this
     access-token-expiry-minutes: 15
     refresh-token-expiry-days: 7

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

