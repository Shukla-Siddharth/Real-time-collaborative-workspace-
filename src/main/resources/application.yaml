spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/collab_db
    username: collab_user
    password: collab_pass

  security:
    user:
      name: admin
      password: admin

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    secret: super-secret-dev-key-change-in-prod
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
